# ============================================================
# Second Skin Sport - Application Configuration
# ============================================================

spring.application.name=second-skin-sport

# ============================================================
# H2 In-Memory Database (Demo Mode)
# ============================================================
#spring.datasource.url=jdbc:h2:mem:secondskindb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
#spring.datasource.driver-class-name=org.h2.Driver
#spring.datasource.username=sa
#spring.datasource.password=
#spring.h2.console.enabled=true
#spring.h2.console.path=/h2-console

# ============================================================
# JPA / Hibernate
# ============================================================
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ============================================================
# SQL Server (Uncomment for production)
# ============================================================
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=SecondSkinSportDB;encrypt=true;trustServerCertificate=true}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}


# ============================================================
# Server
# ============================================================
server.port=8080

# ============================================================
# Actuator
# ============================================================
management.endpoints.web.exposure.include=health,info

# ============================================================
# AI Coach Configuration (Cloud LLM - Google Gemini)
# ============================================================
# Bạn có thể điền API Key trực tiếp vào đây hoặc đặt biến môi trường AI_GEMINI_API_KEY
ai.gemini.api-key=${AI_GEMINI_API_KEY:}
ai.gemini.model=${AI_GEMINI_MODEL:gemini-1.5-flash}

