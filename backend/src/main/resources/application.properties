# ============================================================
# Second Skin Sport - Application Configuration
# ============================================================

spring.application.name=second-skin-sport

# ============================================================
# Database Configuration
# Defaults to persistent file H2 database so the app runs out-of-the-box.
# When DB_URL is provided, Spring Boot automatically connects to SQL Server.
# Example for SQL Server:
# DB_URL=jdbc:sqlserver://localhost:1433;databaseName=SecondSkinSportDB;encrypt=true;trustServerCertificate=true
# ============================================================
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/secondskindb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# ============================================================
# JPA / Hibernate (Auto-detects dialect for H2 and SQL Server)
# ============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console


# ============================================================
# Server
# ============================================================
server.port=8080

# ============================================================
# Actuator
# ============================================================
management.endpoints.web.exposure.include=health,info

# ============================================================
# AI Coach Configuration (Cloud LLM - Google Gemini)
# ============================================================
# Bạn có thể điền API Key trực tiếp vào đây hoặc đặt biến môi trường AI_GEMINI_API_KEY
ai.gemini.api-key=${AI_GEMINI_API_KEY:}
ai.gemini.model=${AI_GEMINI_MODEL:gemini-1.5-flash}

# ============================================================
# Security & JWT Configuration (F01)
# ============================================================
application.security.jwt.secret-key=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
application.security.jwt.expiration=900000
application.security.jwt.refresh-token.expiration=604800000

# ============================================================
# CORS Configuration (F05)
# ============================================================
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}

# ============================================================
# Admin Seeder Configuration (F06)
# ============================================================
admin.default-email=${ADMIN_DEFAULT_EMAIL:admin@secondskin.com}
admin.default-password=${ADMIN_DEFAULT_PASSWORD:admin123}


# Email sender - Gmail SMTP
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Default sender
mail.from-email=${MAIL_FROM_EMAIL:${MAIL_USERNAME:}}
